name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy landing page
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: WealthWatcher.UI/package-lock.json

      - name: Install UI dependencies
        run: npm ci --prefix WealthWatcher.UI

      - name: Build browser-only demo
        run: npm run build:demo --prefix WealthWatcher.UI
        env:
          VITE_DEMO_MODE: 'true'
          VITE_BASE_PATH: './'

      - name: Configure Clarity project
        env:
          CLARITY_PROJECT_ID: ${{ vars.CLARITY_PROJECT_ID }}
        run: |
          if [[ -n "$CLARITY_PROJECT_ID" && ! "$CLARITY_PROJECT_ID" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "CLARITY_PROJECT_ID contains unsupported characters" >&2
            exit 1
          fi
          printf "window.WEALTH_WATCHER_CLARITY_CONFIG = Object.freeze({ projectId: '%s' });\n" "$CLARITY_PROJECT_ID" > github_pages/clarity-config.js

      - name: Configure GA4 measurement ID
        env:
          GA4_MEASUREMENT_ID: ${{ vars.GA4_MEASUREMENT_ID }}
        run: |
          if [[ -n "$GA4_MEASUREMENT_ID" && ! "$GA4_MEASUREMENT_ID" =~ ^G-[A-Za-z0-9]+$ ]]; then
            echo "GA4_MEASUREMENT_ID must start with G- and contain only letters and numbers" >&2
            exit 1
          fi
          printf "window.WEALTH_WATCHER_GA4_CONFIG = Object.freeze({ measurementId: '%s' });\n" "$GA4_MEASUREMENT_ID" > github_pages/ga4-config.js

      - name: Add demo to Pages artifact
        run: |
          mkdir -p github_pages/demo
          cp -R WealthWatcher.UI/dist/. github_pages/demo/

      - name: Validate public Pages artifact
        run: node scripts/validate-public-site.mjs --demo-html github_pages/demo/index.html

      - name: Upload landing page artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./github_pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
