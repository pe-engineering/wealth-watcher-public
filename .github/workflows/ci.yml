name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-metadata:
    name: Release metadata validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Test release metadata parser
        run: node --test scripts/release-notes.test.mjs
      - name: Validate current release metadata
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: node scripts/release-notes.mjs validate
      - name: Validate tagged release metadata
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/release-notes.mjs validate --tag "$GITHUB_REF_NAME"

  api:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore API dependencies
        run: dotnet restore WealthWatcher.Api.Tests/WealthWatcher.Api.Tests.csproj
      - name: Build API
        run: dotnet build WealthWatcher.Api.Tests/WealthWatcher.Api.Tests.csproj --configuration Release --no-restore
      - name: Test API
        run: dotnet test WealthWatcher.Api.Tests/WealthWatcher.Api.Tests.csproj --configuration Release --no-build --no-restore

  relay:
    name: Webhook relay tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore relay dependencies
        run: dotnet restore WealthWatcher.WebhookRelay.Tests/WealthWatcher.WebhookRelay.Tests.csproj
      - name: Build relay
        run: dotnet build WealthWatcher.WebhookRelay.Tests/WealthWatcher.WebhookRelay.Tests.csproj --configuration Release --no-restore
      - name: Test relay
        run: dotnet test WealthWatcher.WebhookRelay.Tests/WealthWatcher.WebhookRelay.Tests.csproj --configuration Release --no-build --no-restore

  ui:
    name: UI tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: WealthWatcher.UI/package-lock.json
      - name: Install UI dependencies
        run: npm ci --prefix WealthWatcher.UI
      - name: Test UI
        run: npm test --prefix WealthWatcher.UI
      - name: Build UI
        run: npm run build --prefix WealthWatcher.UI
      - name: Validate public-site source
        run: node scripts/validate-public-site.mjs

  containers:
    name: Container validation
    needs: [api, relay, ui]
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-placeholder
      RELAY_INSTALLATION_ID: ci-installation
      RELAY_TOKEN: ci-relay-token
      SNAPTRADE_CONSUMER_KEY: ci-consumer-key
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose configuration
        run: docker compose config
      - name: Check API Dockerfile
        run: docker build --check WealthWatcher.Api
      - name: Check webhook relay Dockerfile
        run: docker build --check WealthWatcher.WebhookRelay
      - name: Check UI Dockerfile
        run: docker build --check -f WealthWatcher.UI/Dockerfile .
      - name: Validate standalone relay Compose configuration
        run: docker compose -f docker-compose.relay.yml config --quiet

  sbom:
    name: Dependency inventory
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: WealthWatcher.UI/package-lock.json
      - name: Restore dependencies
        run: |
          dotnet restore WealthWatcher.Api/WealthWatcher.Api.csproj
          dotnet restore WealthWatcher.WebhookRelay/WealthWatcher.WebhookRelay.csproj
          npm ci --prefix WealthWatcher.UI
      - name: Generate dependency inventories
        run: |
          mkdir -p artifacts
          dotnet list WealthWatcher.Api/WealthWatcher.Api.csproj package --include-transitive --format json > artifacts/api-dependencies.json
          dotnet list WealthWatcher.WebhookRelay/WealthWatcher.WebhookRelay.csproj package --include-transitive --format json > artifacts/relay-dependencies.json
          npm sbom --prefix WealthWatcher.UI --sbom-format cyclonedx --sbom-type application > artifacts/ui-sbom.json
      - name: Upload dependency inventories
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-inventories
          path: artifacts/

  publish-images:
    name: Publish ${{ matrix.name }} image
    if: >-
      github.repository == 'pe-engineering/wealth-watcher-public' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [api, ui, containers, sbom, release-metadata]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            context: ./WealthWatcher.Api
            file: ./WealthWatcher.Api/Dockerfile
            image: ghcr.io/pe-engineering/wealth-watcher-public-api
          - name: UI
            context: .
            file: ./WealthWatcher.UI/Dockerfile
            image: ghcr.io/pe-engineering/wealth-watcher-public-web
          - name: Webhook relay
            context: ./WealthWatcher.WebhookRelay
            file: ./WealthWatcher.WebhookRelay/Dockerfile
            image: ghcr.io/pe-engineering/wealth-watcher-public-webhook-relay
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=long,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/pe-engineering/wealth-watcher-public

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign published image
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: cosign sign --yes "${{ matrix.image }}@${{ steps.build.outputs.digest }}"

  create-release:
    name: Create GitHub release
    if: >-
      github.repository == 'pe-engineering/wealth-watcher-public' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    needs: [api, ui, containers, sbom, release-metadata, publish-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Validate tagged release metadata
        run: node scripts/release-notes.mjs validate --tag "$GITHUB_REF_NAME"

      - name: Prepare release notes
        run: node scripts/release-notes.mjs body --version "$GITHUB_REF_NAME" > release-body.md

      - name: Create or refresh GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Wealth Watcher $GITHUB_REF_NAME" \
              --notes-file release-body.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Wealth Watcher $GITHUB_REF_NAME" \
              --notes-file release-body.md \
              --verify-tag
          fi
