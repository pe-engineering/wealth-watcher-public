services:
  db:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wealthwatcher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting the stack}
      POSTGRES_DB: ${POSTGRES_DB:-wealthwatcherdb}
    volumes:
      # PostgreSQL 18 stores data beneath a versioned subdirectory.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${DB_PORT:-5432}:5432"
    restart: unless-stopped

  api:
    image: ${API_IMAGE:-wealth-watcher-api}
    build:
      context: ./WealthWatcher.Api
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_SYSTEM_NET_DISABLEIPV6: ${DOTNET_SYSTEM_NET_DISABLEIPV6:-1}
      ConnectionStrings__DefaultConnection: Host=db;Database=${POSTGRES_DB:-wealthwatcherdb};Username=${POSTGRES_USER:-wealthwatcher};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting the stack}
      CredentialKeyPath: /app/config/keys
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN_0:-http://localhost:8182}
      Cors__AllowedOrigins__1: ${CORS_ALLOWED_ORIGIN_1:-http://127.0.0.1:8182}
      WebhookRelay__Enabled: ${WEBHOOK_RELAY_ENABLED:-false}
      WebhookRelay__Url: ${WEBHOOK_RELAY_URL:-}
      WebhookRelay__HttpUrl: ${WEBHOOK_RELAY_HTTP_URL:-}
      WebhookRelay__InstallationId: ${WEBHOOK_RELAY_INSTALLATION_ID:-}
      WebhookRelay__Token: ${WEBHOOK_RELAY_TOKEN:-}
      WebhookRelay__PublicBaseUrl: ${WEBHOOK_RELAY_PUBLIC_BASE_URL:-}
    volumes:
      - ${CONFIG_PATH:-./config}:/app/config # Persists local data-protection keys for encrypted integration credentials
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-5000}:8080"
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:-wealth-watcher-web}
    build:
      context: .
      dockerfile: ./WealthWatcher.UI/Dockerfile
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8182}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
